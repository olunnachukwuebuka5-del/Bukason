<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>BUKASON — Ask Anything</title>

<!-- Branded link preview (so it looks trustworthy, not spammy, when shared on WhatsApp) -->
<meta property="og:title" content="BUKASON Assistant — Free help for Nigerian students">
<meta property="og:description" content="Academics and business help, built for Nigerian students. Free, no signup.">
<meta property="og:image" content="icon-512.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0A1830">

<!-- Installable as an app (Add to Home Screen) -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BUKASON">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --navy: #0A1830;
    --navy-deep: #050D1C;
    --navy-mid: #12274A;
    --paper: #FAFBFD;
    --line: #DDE3EE;
    --ink: #101826;
    --sub: #5B6B85;
    --gold: #D4AF37;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }

  /* Header */
  header{
    background:var(--navy);
    background-image: radial-gradient(circle at 85% -20%, var(--navy-mid) 0%, var(--navy) 55%, var(--navy-deep) 100%);
    color:#fff;
    padding:18px 20px 16px;
    flex-shrink:0;
    position:relative;
  }
  .brand-row{display:flex;align-items:center;gap:10px;}
  .brand-row .brand-text{flex:1;}
  .menu-btn{
    width:38px;height:38px;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.16);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .menu-btn svg{width:19px;height:19px;}
  .mark{
    width:38px;height:38px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .mark img{width:100%;height:100%;object-fit:contain;}
  .brand-text{line-height:1.15;}
  .brand-text .name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;letter-spacing:0.02em;}
  .brand-text .tag{font-size:11.5px;color:#AEBBD6;margin-top:1px;}
  .current-mode-label{
    margin-top:12px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    color:var(--gold);
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:5px 11px;
    border-radius:20px;
  }

  /* Side menu */
  #menuOverlay{
    position:fixed;inset:0;
    background:rgba(5,13,28,0.55);
    display:none;
    z-index:110;
  }
  #menuOverlay.open{display:block;}
  #menuPanel{
    position:absolute;
    top:0;right:0;
    height:100%;
    width:78%;
    max-width:300px;
    background:var(--navy-deep);
    box-shadow:-8px 0 24px rgba(0,0,0,0.3);
    transform:translateX(100%);
    transition:transform .22s ease;
    display:flex;
    flex-direction:column;
    padding:22px 0;
  }
  #menuOverlay.open #menuPanel{transform:translateX(0);}
  .menu-header{
    padding:0 20px 18px;
    border-bottom:1px solid rgba(255,255,255,0.1);
    margin-bottom:8px;
  }
  .menu-header .name{font-family:'Space Grotesk',sans-serif;color:#fff;font-weight:700;font-size:16px;}
  .menu-header .tag{color:#AEBBD6;font-size:11px;margin-top:2px;}
  .menu-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 20px;
    color:#D9E1F0;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:500;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    border-left:3px solid transparent;
  }
  .menu-item.active{
    background:rgba(212,175,55,0.1);
    color:var(--gold);
    border-left-color:var(--gold);
    font-weight:600;
  }
  .menu-item svg{width:18px;height:18px;flex-shrink:0;}
  .menu-divider{height:1px;background:rgba(255,255,255,0.08);margin:8px 20px;}

  /* Chat area */
  #chat{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 8px;
    -webkit-overflow-scrolling:touch;
  }
  .msg{
    max-width:86%;
    margin-bottom:12px;
    display:flex;
    flex-direction:column;
  }
  .msg.user{margin-left:auto;align-items:flex-end;}
  .msg.bot{margin-right:auto;align-items:flex-start;}
  .bubble{
    padding:11px 14px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .msg.user .bubble{
    background:var(--navy);
    color:#fff;
    border-bottom-right-radius:5px;
  }
  .msg.bot .bubble{
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink);
    border-bottom-left-radius:5px;
  }
  .msg.bot .who{
    font-size:10.5px;
    color:var(--sub);
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    margin:0 2px 4px;
  }

  .intro{
    text-align:center;
    padding:28px 20px 10px;
    color:var(--sub);
  }
  .intro .big{
    font-family:'Space Grotesk',sans-serif;
    color:var(--ink);
    font-size:19px;
    font-weight:600;
    margin-bottom:6px;
  }
  .intro .small{font-size:13px;line-height:1.5;}

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    padding:16px 12px 6px;
  }
  .chip{
    background:#fff;
    border:1px solid var(--line);
    color:var(--navy);
    font-size:12.5px;
    font-weight:500;
    padding:8px 13px;
    border-radius:20px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .chip:active{background:#EEF2F9;}

  .typing{display:flex;gap:4px;padding:4px 2px;}
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--sub);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}

  /* Footer link bar */
  #linkBar{
    flex-shrink:0;
    display:flex;
    gap:10px;
    padding:8px 12px;
    background:var(--paper);
    border-top:1px solid var(--line);
  }
  .social-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:9px 10px;
    border-radius:11px;
    text-decoration:none;
    font-size:12.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .social-btn.whatsapp{
    background:#e9fbf0;
    color:#128C4A;
    border:1px solid #bdeed2;
  }
  .social-btn.telegram{
    background:#eaf5ff;
    color:#1E88C7;
    border:1px solid #c6e6fb;
  }
  .social-btn.report{
    background:#FBEFE6;
    color:#B5622B;
    border:1px solid #f2d9c2;
    flex:0 0 auto;
    padding:9px 14px;
  }
  .social-btn svg{width:16px;height:16px;flex-shrink:0;}

  /* Input */
  #inputBar{
    flex-shrink:0;
    display:flex;
    gap:8px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--paper);
    border-top:1px solid var(--line);
  }
  #textInput{
    flex:1;
    border:1px solid var(--line);
    background:#fff;
    border-radius:22px;
    padding:11px 16px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    outline:none;
  }
  #textInput:focus{border-color:var(--navy);}
  #sendBtn{
    width:42px;height:42px;
    border-radius:50%;
    border:none;
    background:var(--navy);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    -webkit-tap-highlight-color:transparent;
  }
  #sendBtn:active{background:var(--navy-deep);}
  #sendBtn:disabled{opacity:.4;}
  #sendBtn svg{width:18px;height:18px;}

  ::-webkit-scrollbar{width:0;}

  /* Visual polish */
  .msg{animation:fadeUp .25s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .bubble{box-shadow:0 1px 2px rgba(10,24,48,0.04);}
  header{box-shadow:0 4px 16px rgba(5,13,28,0.18);}

  /* Report modal */
  #reportOverlay{
    position:fixed;inset:0;
    background:rgba(5,13,28,0.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
  }
  #reportOverlay.open{display:flex;}
  #reportSheet{
    background:var(--paper);
    width:100%;
    max-width:480px;
    border-radius:18px 18px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    animation:slideUp .2s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  #reportSheet h3{margin:0 0 4px;font-family:'Space Grotesk',sans-serif;color:var(--ink);font-size:17px;}
  #reportSheet p{margin:0 0 14px;color:var(--sub);font-size:13px;}
  #reportSheet textarea, #reportSheet input{
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 13px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    margin-bottom:10px;
    resize:vertical;
    background:#fff;
  }
  #reportSheet textarea{min-height:90px;}
  .sheet-actions{display:flex;gap:10px;margin-top:4px;}
  .sheet-btn{flex:1;padding:11px;border-radius:10px;border:none;font-weight:600;font-size:14px;-webkit-tap-highlight-color:transparent;}
  .sheet-btn.cancel{background:#EEF1F6;color:var(--sub);}
  .sheet-btn.submit{background:var(--navy);color:#fff;}
  #reportStatus{font-size:13px;margin-top:8px;display:none;}
  #reportStatus.ok{color:#128C4A;}
  #reportStatus.err{color:#B3261E;}
</style>
</head>

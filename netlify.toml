[build]
  publish = "."
  functions = "netlify/functions"

# Always fetch the newest service worker so updates reach phones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Gathers knowledge by itself every 3 minutes (1 topic per run).
[functions."auto-gather"]
  schedule = "*/3 * * * *"
